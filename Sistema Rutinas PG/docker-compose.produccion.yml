# Composicion de produccion (apartado 3.8 de la tesis).
#
# Levanta los tres componentes del sistema —base de datos, servicios e interfaz—
# separados del entorno de desarrollo, que sigue en `docker-compose.yml`. La
# separacion de entornos es el primer requisito del apartado 3.8 y evita que una
# prueba toque los datos reales de los usuarios del gimnasio.
#
#     docker compose -f docker-compose.produccion.yml --env-file .env.produccion up -d
#
# Ningun valor sensible esta escrito aqui: todos se leen del archivo de entorno,
# que no se versiona. Antes de desplegar, copie `.env.produccion.example` y
# reemplace **todas** las credenciales predeterminadas.

name: sistema-rutinas-produccion

services:
  base_datos:
    image: mysql:8.4
    container_name: rutinas_mysql_produccion
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD}
    volumes:
      - datos_mysql_produccion:/var/lib/mysql
      - ./respaldos:/respaldos
    # La base de datos no publica ningun puerto al exterior: solo los servicios
    # la alcanzan, por la red interna de la composicion.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  servicios:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rutinas_servicios
    restart: always
    depends_on:
      base_datos:
        condition: service_healthy
    environment:
      URL_BASE_DATOS: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@base_datos:3306/${MYSQL_DATABASE}
      CLAVE_SECRETA: ${CLAVE_SECRETA:?defina CLAVE_SECRETA}
      MINUTOS_EXPIRACION_SESION: ${MINUTOS_EXPIRACION_SESION:-30}
      ORIGENES_PERMITIDOS: ${ORIGENES_PERMITIDOS:?defina ORIGENES_PERMITIDOS}
      ADMIN_CORREO: ${ADMIN_CORREO:?defina ADMIN_CORREO}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:?defina ADMIN_CONTRASENA}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador del sistema}
      ENTORNO: produccion
    volumes:
      # El modelo entrenado vive fuera de la imagen: sobrevive a la
      # actualizacion del contenedor y puede reentrenarse sin reconstruirla
      # (requerimiento no funcional 4.5.6).
      - modelo_entrenado:/aplicacion/modelo
    expose:
      - "8000"

  interfaz:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # En produccion la interfaz y los servicios comparten dominio: la ruta
        # relativa basta y evita configurar origenes cruzados.
        VITE_URL_API: /api/v1
    container_name: rutinas_interfaz
    restart: always
    depends_on:
      - servicios
    ports:
      # El cifrado del transito lo termina el proxy inverso del servidor, que
      # publica el 443 y reenvia a este puerto. Publicar el 80 directamente sin
      # ese proxy dejaria las credenciales en claro.
      - "${PUERTO_PUBLICO:-8080}:80"

volumes:
  datos_mysql_produccion:
  modelo_entrenado:
