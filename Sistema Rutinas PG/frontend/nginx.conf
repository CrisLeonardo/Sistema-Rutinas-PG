# Servidor de la interfaz de cliente en produccion.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion de los archivos de texto: la mayoria de los usuarios accede
    # desde una conexion movil, y el requerimiento 4.5.2 exige que las pantallas
    # carguen en menos de dos segundos sobre tercera generacion.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Encabezados de seguridad. El cifrado del transito lo resuelve el proxy que
    # termina el certificado, no este servidor.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Los archivos con huella en el nombre no cambian nunca: se guardan en la
    # memoria del navegador por un anio.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Las peticiones a los servicios se reenvian al contenedor del backend, de
    # modo que la interfaz y la interfaz de programacion compartan dominio y no
    # haga falta configurar origenes cruzados.
    location /api/ {
        proxy_pass http://servicios:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La generacion de un plan puede tardar unos segundos la primera vez.
        proxy_read_timeout 60s;
    }

    # La aplicacion resuelve sus propias rutas: cualquier direccion que no
    # corresponda a un archivo se entrega al index para que React la atienda.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
