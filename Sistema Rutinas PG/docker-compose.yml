services:
  base_datos:
    image: mysql:8.4
    container_name: rutinas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rutinas_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sistema_rutinas}
      MYSQL_USER: ${MYSQL_USER:-rutinas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rutinas_pass}
    ports:
      - "3307:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rutinas_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  datos_mysql:
