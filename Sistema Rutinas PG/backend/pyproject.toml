[project]
name = "sistema-rutinas-backend"
version = "0.1.0"
description = "Servicios del sistema de generacion de planes nutricionales y rutinas de entrenamiento"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "numpy>=2.5.2",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
# El backend se ejecuta directamente desde la carpeta app/, no se instala como
# paquete distribuible, por lo que solo se resuelven sus dependencias.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lenta: prueba que entrena la red neuronal; se excluye con -m \"not lenta\"",
]
